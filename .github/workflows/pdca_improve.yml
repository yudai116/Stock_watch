name: PDCAループ 検証役＋チェッカー自動実行

# バックテスト完了後に自動トリガー
on:
  workflow_run:
    workflows: ["バックテスト実行（実データ・22ジョブ並列）"]
    types: [completed]
    branches: [main]

jobs:

  verify-and-improve:
    # バックテストが成功した場合のみ実行
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存ライブラリインストール
        run: pip install numpy anthropic --quiet

      # ── Step 1: チェッカー実行（改善前の現状確認）─────────────────────────
      - name: チェッカー実行（改善前）
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "=== チェッカー起動 (claude-opus-4-8) ==="
          python3 backtest/pdca_verify_agent.py \
            --mode check \
            --output /tmp/checker_before.txt \
            && echo "CHECKER_BEFORE=PASS" >> $GITHUB_ENV \
            || echo "CHECKER_BEFORE=FAIL" >> $GITHUB_ENV
          echo "--- チェッカー結果 ---"
          cat /tmp/checker_before.txt

      # ── Step 2: 検証役実行（改善案の立案と実装）──────────────────────────
      - name: 検証役実行（改善案の立案・実装）
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "=== 検証役起動 (claude-opus-4-8) ==="
          python3 backtest/pdca_verify_agent.py \
            --mode improve \
            --output /tmp/improve_result.txt
          echo "--- 検証役レポート ---"
          cat /tmp/improve_result.txt
          echo ""
          echo "--- strategy_search.py の変更内容 ---"
          git diff backtest/strategy_search.py | head -200

      # ── Step 3: チェッカー再実行（改善後の確認）──────────────────────────
      - name: チェッカー再実行（改善後）
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "=== チェッカー再実行 (claude-opus-4-8) ==="
          python3 backtest/pdca_verify_agent.py \
            --mode check \
            --output /tmp/checker_after.txt \
            && echo "CHECKER_AFTER=PASS" >> $GITHUB_ENV \
            || echo "CHECKER_AFTER=FAIL" >> $GITHUB_ENV
          echo "--- チェッカー結果 ---"
          cat /tmp/checker_after.txt

      # ── Step 4: PASS なら改善をコミット & プッシュ ────────────────────────
      - name: 改善をコミット & プッシュ
        if: ${{ env.CHECKER_AFTER == 'PASS' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backtest/strategy_search.py
          git diff --staged --quiet && echo "変更なし（改善不要）" || (
            SUMMARY=$(grep -oP "## 改善案 #[0-9]+: \K[^\n]+" /tmp/improve_result.txt \
                      | head -3 | tr '\n' ' ' | cut -c1-120)
            [ -z "$SUMMARY" ] && SUMMARY="検証役による自動改善"
            git commit -m "improve(strategy): ${SUMMARY}" &&
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && break
              echo "Push retry $i/5, waiting $((i*3))s..." && sleep $((i*3))
            done &&
            echo "✅ 改善をプッシュしました"
          )

      # ── Step 5: FAIL の場合はスキップ ────────────────────────────────────
      - name: チェッカーFAILの場合のログ
        if: ${{ env.CHECKER_AFTER == 'FAIL' }}
        run: |
          echo "⚠️ チェッカーFAIL: 改善はプッシュしませんでした"
          echo "次のバックテストは pdca_loop によって引き続き自動実行されます"

      # ── Step 6: レポートを保存 ────────────────────────────────────────────
      - name: 検証レポートをアーティファクトとして保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdca-verify-report-${{ github.run_id }}
          path: |
            /tmp/checker_before.txt
            /tmp/improve_result.txt
            /tmp/checker_after.txt
          retention-days: 14
