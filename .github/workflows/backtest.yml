        uses: actions/download-artifact@v4
        with:
          name: result-day
          path: backtest/
        continue-on-error: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: スコア重みを自動更新
        run: python3 backtest/update_scorer.py
        continue-on-error: true
      - name: 結果コミット & プッシュ
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backtest/strategy_results_swing.json \
                  backtest/strategy_results_day.json \
                  lib/backtestWeights.ts 2>/dev/null || true
          git diff --staged --quiet && echo "変更なし" || (
            git commit -m "chore: バックテスト結果を更新 [skip ci]" &&
            git push origin main
          )
