name: バックテスト実行（実データ）

on:
  workflow_dispatch:        # iPhone / GitHub から手動起動
    inputs:
      mode:
        description: 'バックテストモード'
        required: false
        default: 'swing'
        type: choice
        options:
          - swing     # スイングトレード (デフォルト)
          - day       # デイトレード
          - both      # 両方同時並列実行 (各~4時間, 合計~4時間)
  schedule:
    - cron: '0 1 * * 0'    # 毎週日曜 AM10:00 JST に自動実行（swing）

jobs:
  # ── Job 1: 価格データ取得 (共通) ───────────────────────────────────────────
  fetch-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          ref: claude/stock-price-dashboard-QrhiS

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: npm install
        run: npm ci

      - name: 1時間足データ取得 (直近730日, 25銘柄)
        run: node backtest/fetch_data.mjs --intraday

      - name: データファイルをアーティファクトとして保存
        uses: actions/upload-artifact@v4
        with:
          name: price-data
          path: backtest/price_data_intraday.json
          retention-days: 1

  # ── Job 2: スイング戦略最適化 (並列) ─────────────────────────────────────
  optimize-swing:
    needs: fetch-data
    if: ${{ github.event.inputs.mode != 'day' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350      # 5時間50分 (GHA上限6時間の直前)

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          ref: claude/stock-price-dashboard-QrhiS

      - name: 価格データを取得
        uses: actions/download-artifact@v4
        with:
          name: price-data
          path: backtest/

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: numpy インストール
        run: pip install numpy --quiet

      - name: スイング戦略最適化 (DOE→WF4fold×全売りルール→GA→ホールドアウト)
        run: python3 backtest/strategy_search.py --swing

      - name: 結果をアーティファクトとして保存
        uses: actions/upload-artifact@v4
        with:
          name: result-swing
          path: backtest/strategy_results_swing.json
          retention-days: 1

  # ── Job 3: デイトレ戦略最適化 (並列) ─────────────────────────────────────
  optimize-day:
    needs: fetch-data
    if: ${{ github.event.inputs.mode == 'day' || github.event.inputs.mode == 'both' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350      # 5時間50分

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          ref: claude/stock-price-dashboard-QrhiS

      - name: 価格データを取得
        uses: actions/download-artifact@v4
        with:
          name: price-data
          path: backtest/

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: numpy インストール
        run: pip install numpy --quiet

      - name: デイトレ戦略最適化 (DOE→WF4fold×全売りルール→GA→ホールドアウト)
        run: python3 backtest/strategy_search.py --day

      - name: 結果をアーティファクトとして保存
        uses: actions/upload-artifact@v4
        with:
          name: result-day
          path: backtest/strategy_results_day.json
          retention-days: 1

  # ── Job 4: 結果をリポジトリにコミット (両Job完了後) ──────────────────────
  commit-results:
    needs: [optimize-swing, optimize-day]
    if: |
      always() && !cancelled() &&
      (needs.optimize-swing.result == 'success' || needs.optimize-day.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          ref: claude/stock-price-dashboard-QrhiS

      - name: 価格データを取得
        uses: actions/download-artifact@v4
        with:
          name: price-data
          path: backtest/
        continue-on-error: true

      - name: スイング結果を取得
        uses: actions/download-artifact@v4
        with:
          name: result-swing
          path: backtest/
        continue-on-error: true

      - name: デイトレ結果を取得
        uses: actions/download-artifact@v4
        with:
          name: result-day
          path: backtest/
        continue-on-error: true

      - name: 結果コミット & プッシュ
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backtest/price_data_intraday.json \
                  backtest/strategy_results_swing.json \
                  backtest/strategy_results_day.json 2>/dev/null || true
          git diff --staged --quiet && echo "変更なし" || (
            git commit -m "chore: バックテスト結果を更新 [skip ci]" &&
            git push origin claude/stock-price-dashboard-QrhiS
          )
