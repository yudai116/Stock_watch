      - uses: actions/download-artifact@v4
        with:
          name: doe-day
          path: backtest/phase_artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: wf-day-fold-0
          path: backtest/phase_artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: wf-day-fold-1
          path: backtest/phase_artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: wf-day-fold-2
          path: backtest/phase_artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: wf-day-fold-3
          path: backtest/phase_artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: final-day
          path: backtest/phase_artifacts/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy --quiet
      - name: デイトレ アセンブル実行
        run: python3 backtest/strategy_search.py --phase assemble --mode day
      - uses: actions/upload-artifact@v4
        with:
          name: result-day
          path: backtest/strategy_results_day.json
          retention-days: 7

  # ── Job 16: 結果をリポジトリにコミット ────────────────────────────────────
  commit-results:
    needs: [swing-assemble, day-assemble]
    if: |
      always() && !cancelled() &&
      (needs.swing-assemble.result == 'success' || needs.day-assemble.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
      - name: スイング結果を取得
        uses: actions/download-artifact@v4
        with:
          name: result-swing
          path: backtest/
        continue-on-error: true
      - name: デイトレ結果を取得
        uses: actions/download-artifact@v4
        with:
          name: result-day
          path: backtest/
        continue-on-error: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: スコア重みを自動更新
        run: python3 backtest/update_scorer.py
        continue-on-error: true
      - name: 結果コミット & プッシュ
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backtest/strategy_results_swing.json \
                  backtest/strategy_results_day.json \
                  lib/backtestWeights.ts 2>/dev/null || true
          git diff --staged --quiet && echo "変更なし" || (
            git commit -m "chore: バックテスト結果を更新 [skip ci]" &&
            git push origin main
          )
