name: バックテスト実行（実データ・16ジョブ並列）

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'バックテストモード'
        required: false
        default: 'swing'
        type: choice
        options:
          - swing
          - day
          - both
  schedule:
    - cron: '0 1 * * 0'

# ── チェックポイント/再開の仕組み ────────────────────────────────────────────
# 全体の目標実行時間: 5〜6時間未満 (--both モード)
#   fetch(~20分) + DOE(~10分) + WF/Final並列(230分) + Assemble(~10分) + commit(~5分) ≈ 5.5h
#
# WF fold / final ジョブがタイムリミット (230分) を超えた場合:
#   - チェックポイントをアーティファクトに保存して exit 1 (= ジョブ失敗)
#   - GitHub Actions の "Re-run failed jobs" を実行すると続きから再開
#   - チェックポイントには完了した売りルールのGA結果が保存されており、
#     再実行時はスキップして残りから処理を開始する

jobs:

  # ── Job 1: 価格データ取得 ──────────────────────────────────────────────────
  fetch-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: npm install
        run: npm ci
      - name: 1時間足データ取得 (直近730日, 25銘柄) — デイトレ用
        run: node backtest/fetch_data.mjs --intraday
      - name: 日足データ取得 (10年, 25銘柄) — スイング用
        run: node backtest/fetch_data.mjs
      - name: デイトレ用データをアーティファクトとして保存
        uses: actions/upload-artifact@v4
        with:
          name: price-data
          path: backtest/price_data_intraday.json
          retention-days: 1
      - name: スイング用データをアーティファクトとして保存
        uses: actions/upload-artifact@v4
        with:
          name: price-data-swing
          path: backtest/price_data.json
          retention-days: 1

  # ── Job 2: スイング DOE ────────────────────────────────────────────────────
  swing-doe:
    needs: fetch-data
    if: ${{ github.event.inputs.mode != 'day' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: price-data-swing
          path: backtest/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy --quiet
      - run: mkdir -p backtest/phase_artifacts
      - name: スイング DOE 実行
        run: python3 backtest/strategy_search.py --phase doe --mode swing
      - uses: actions/upload-artifact@v4
        with:
          name: doe-swing
          path: backtest/phase_artifacts/doe_swing.json
          retention-days: 1

  # ── Job 3: デイトレ DOE ────────────────────────────────────────────────────
  day-doe:
    needs: fetch-data
    if: ${{ github.event.inputs.mode == 'day' || github.event.inputs.mode == 'both' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: price-data
          path: backtest/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy --quiet
      - run: mkdir -p backtest/phase_artifacts
      - name: デイトレ DOE 実行
        run: python3 backtest/strategy_search.py --phase doe --mode day
      - uses: actions/upload-artifact@v4
        with:
          name: doe-day
          path: backtest/phase_artifacts/doe_day.json
          retention-days: 1

  # ── Job 4: スイング WF Fold 0 ─────────────────────────────────────────────
  swing-wf-fold-0:
    needs: [fetch-data, swing-doe]
    if: ${{ github.event.inputs.mode != 'day' }}
    runs-on: ubuntu-latest
    timeout-minutes: 255
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: price-data-swing
          path: backtest/
      - run: mkdir -p backtest/phase_artifacts/checkpoint_swing_fold_0
      - uses: actions/download-artifact@v4
        with:
          name: doe-swing
          path: backtest/phase_artifacts/
      - name: チェックポイント取得 (前回の続きがあれば)
        uses: actions/download-artifact@v4
        with:
          name: checkpoint-swing-fold-0
          path: backtest/phase_artifacts/checkpoint_swing_fold_0/
        continue-on-error: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy --quiet
      - name: スイング WF Fold 0 実行
        id: run_fold
        run: python3 backtest/strategy_search.py --phase wf-fold --mode swing --fold 0 --time-limit 230
      - name: チェックポイント保存 (常に実行)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-swing-fold-0
          path: backtest/phase_artifacts/checkpoint_swing_fold_0/
          retention-days: 7
          overwrite: true
      - name: 完了時フォールド結果を保存
        if: steps.run_fold.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: wf-swing-fold-0
          path: backtest/phase_artifacts/wf_swing_fold_0.json
          retention-days: 1

  # ── Job 5: スイング WF Fold 1 ─────────────────────────────────────────────
