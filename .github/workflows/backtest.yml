name: Backtest Pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Backtest mode"
        required: true
        default: "all"
        type: choice
        options: ["all", "swing", "day"]
      skip_fetch:
        description: "Skip data fetch (use cached)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      skip_regime:
        description: "Skip HMM regime detection"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

  schedule:
    # 毎週月曜 00:00 UTC に自動実行 (週次バックテスト)
    - cron: "0 0 * * 1"

jobs:
  backtest:
    name: "Backtest (${{ github.event.inputs.mode || 'all' }})"
    runs-on: ubuntu-latest
    timeout-minutes: 360   # 最大 6時間

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            numpy \
            scikit-learn \
            hmmlearn \
            yfinance \
            requests \
            scipy

      - name: Restore price data cache
        uses: actions/cache@v4
        with:
          path: |
            backtest/price_data.json
            backtest/price_data_intraday.json
            backtest/macro_data.json
          key: price-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            price-data-${{ runner.os }}-

      - name: Run pipeline
        env:
          ALPACA_API_KEY:    ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: |
          MODE="${{ github.event.inputs.mode || 'all' }}"
          ARGS="--mode $MODE"
          [ "${{ github.event.inputs.skip_fetch }}" = "true" ]  && ARGS="$ARGS --skip-fetch"
          [ "${{ github.event.inputs.skip_regime }}" = "true" ] && ARGS="$ARGS --skip-regime"
          python -m backtest.pipeline $ARGS

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest-results-${{ github.run_number }}
          path: |
            backtest/results_swing.json
            backtest/results_day.json
            backtest/regime_signals.json
          retention-days: 90
