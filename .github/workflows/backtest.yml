  # ── Job 16: 結果をリポジトリにコミット ────────────────────────────────────
  commit-results:
    needs: [swing-assemble, day-assemble]
    if: |
      always() && !cancelled() &&
      (needs.swing-assemble.result == 'success' || needs.day-assemble.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
      - name: スイング結果を取得
        uses: actions/download-artifact@v4
        with:
          name: result-swing
          path: backtest/
        continue-on-error: true
      - name: デイトレ結果を取得
        uses: actions/download-artifact@v4
        with:
          name: result-day
          path: backtest/
        continue-on-error: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: スコア重みを自動更新
        run: python3 backtest/update_scorer.py
        continue-on-error: true
      - name: 結果コミット & プッシュ
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backtest/strategy_results_swing.json \
                  backtest/strategy_results_day.json \
                  lib/backtestWeights.ts 2>/dev/null || true
          git diff --staged --quiet && echo "変更なし" || (
            git commit -m "chore: バックテスト結果を更新 [skip ci]" &&
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && break
              echo "Push retry $i/5, waiting $((i*3))s..." && sleep $((i*3))
            done
          )

      - name: PDCAループ自動実行 — 次パラメータ決定 & トリガー更新
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install numpy --quiet
          # pdca_loop.py を実行して次パラメータを決定
          PDCA_JSON=$(python3 backtest/pdca_loop.py 2>/dev/null | tail -1)
          echo "PDCA出力: $PDCA_JSON"

          ACTION=$(echo "$PDCA_JSON" | python3 -c "import sys,json; print(json.loads(sys.stdin.read()).get('action','stop'))")
          echo "アクション: $ACTION"

          if [ "$ACTION" = "trigger" ]; then
            echo "次のバックテストをトリガーします..."
            # pdca_loop.py がすでに pdca_trigger.json と pdca_state.json を書き出し済み
            git add backtest/pdca_trigger.json backtest/pdca_state.json
            git diff --staged --quiet && echo "変更なし（パラメータ同じ）" || (
              REASON=$(echo "$PDCA_JSON" | python3 -c "import sys,json; print(json.loads(sys.stdin.read()).get('reason',''))")
              RUN_N=$(echo "$PDCA_JSON" | python3 -c "import sys,json; print(json.loads(sys.stdin.read()).get('run_count','?'))")
              git commit -m "trigger: PDCAループ run#${RUN_N} — ${REASON} [skip ci]" &&
              for i in 1 2 3 4 5; do
                git pull --rebase origin main && git push origin HEAD:main && break
                echo "Push retry $i/5, waiting $((i*3))s..." && sleep $((i*3))
              done
            )
            # repository_dispatch で次バックテストを起動（GITHUB_TOKEN の push は push トリガーを起動しないため）
            curl -s -X POST \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
              -d "{\"event_type\":\"pdca-trigger\",\"client_payload\":{\"run_count\":${RUN_N},\"reason\":\"${REASON}\"}}"
            echo "次のバックテストをトリガーしました (repository_dispatch)"
          elif [ "$ACTION" = "stop" ]; then
            REASON=$(echo "$PDCA_JSON" | python3 -c "import sys,json; print(json.loads(sys.stdin.read()).get('reason',''))")
            echo "PDCAループ停止: $REASON"
            # 停止記録をコミット
            git add backtest/pdca_state.json
            git diff --staged --quiet || (
              git commit -m "chore: PDCAループ完了 — ${REASON} [skip ci]" &&
              for i in 1 2 3 4 5; do
                git pull --rebase origin main && git push origin HEAD:main && break
                echo "Push retry $i/5, waiting $((i*3))s..." && sleep $((i*3))
              done
            )
          fi
