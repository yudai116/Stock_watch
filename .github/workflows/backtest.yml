name: バックテスト実行（実データ・16ジョブ並列）

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'バックテストモード'
        required: false
        default: 'both'
        type: choice
        options:
          - swing
          - day
          - both
      ga_l2_lambda:
        description: 'L2正則化強度 (デフォルト: 0.5, 過学習時は増やす)'
        required: false
        default: '0.5'
        type: string
      threshold_offset:
        description: '買い閾値オフセット (0=デフォルト, -10=閾値を10下げる)'
        required: false
        default: '0'
        type: string
  schedule:
    - cron: '0 1 * * 0'

env:
  GA_L2_LAMBDA:      ${{ github.event.inputs.ga_l2_lambda    || '0.5' }}
  THRESHOLD_OFFSET:  ${{ github.event.inputs.threshold_offset || '0'   }}

# ── チェックポイント/再開の仕組み ────────────────────────────────────────────
# 全体の目標実行時間: 5〜6時間未満 (--both モード)
#   fetch(~20分) + DOE(~10分) + WF/Final並列(230分) + Assemble(~10分) + commit(~5分) ≈ 5.5h
#
# WF fold / final ジョブがタイムリミット (230分) を超えた場合:
#   - チェックポイントをアーティファクトに保存して exit 1 (= ジョブ失敗)
#   - GitHub Actions の "Re-run failed jobs" を実行すると続きから再開
#   - チェックポイントには完了した売りルールのGA結果が保存されており、
#     再実行時はスキップして残りから処理を開始する

jobs:

  # ── Job 1: 価格データ取得 ──────────────────────────────────────────────────
  fetch-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: npm install
        run: npm ci
      - name: US 1時間足データ取得 (Alpaca優先/最大10年, US38銘柄) — スイング最適化用
        run: node backtest/fetch_data.mjs --intraday
        env:
          ALPACA_API_KEY:    ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      - name: JP 1時間足データ取得 (Yahoo/730日, JP12銘柄) — JP OOSテスト用
        run: node backtest/fetch_data.mjs --intraday-jp
      - name: 10分足データ取得 US (Alpaca/最大10年) — デイトレ用
        if: ${{ github.event.inputs.mode == 'day' || github.event.inputs.mode == 'both' || github.event.inputs.mode == '' }}
        run: node backtest/fetch_data.mjs --day
        env:
          ALPACA_API_KEY:    ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      - name: 10分足データ取得 JP (J-Quants/2年) — デイトレ用 (JQUANTS_EMAIL 設定時のみ)
        if: ${{ (github.event.inputs.mode == 'day' || github.event.inputs.mode == 'both' || github.event.inputs.mode == '') && secrets.JQUANTS_EMAIL != '' }}
        run: |
          pip install requests --quiet
          python backtest/fetch_data_jquants.py
        env:
          JQUANTS_EMAIL:    ${{ secrets.JQUANTS_EMAIL }}
          JQUANTS_PASSWORD: ${{ secrets.JQUANTS_PASSWORD }}
      - name: スイング用データをアーティファクトとして保存 (US 1時間足)
        uses: actions/upload-artifact@v4
        with:
          name: price-data-swing
          path: backtest/price_data_intraday.json
          retention-days: 1
      - name: JP OOSテスト用データをアーティファクトとして保存 (JP 1時間足)
        uses: actions/upload-artifact@v4
        with:
          name: price-data-swing-jp
          path: backtest/price_data_intraday_jp.json
          retention-days: 1
      - name: デイトレ用データをアーティファクトとして保存 (US 10分足)
        uses: actions/upload-artifact@v4
        with:
          name: price-data-day
          path: backtest/price_data_10min.json
          retention-days: 1
      - name: デイトレ用データをアーティファクトとして保存 (JP 10分足, 存在する場合)
        uses: actions/upload-artifact@v4
        with:
          name: price-data-day-jp
          path: backtest/price_data_10min_jp.json
          retention-days: 1
        continue-on-error: true

  # ── Job 2: スイング DOE ────────────────────────────────────────────────────
  swing-doe:
    needs: fetch-data
    if: ${{ github.event.inputs.mode != 'day' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: price-data-swing
          path: backtest/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy --quiet
      - run: mkdir -p backtest/phase_artifacts
      - name: スイング DOE 実行
        run: python3 backtest/strategy_search.py --phase doe --mode swing
      - uses: actions/upload-artifact@v4
        with:
          name: doe-swing
          path: backtest/phase_artifacts/doe_swing.json
          retention-days: 1

  # ── Job 3: デイトレ DOE ────────────────────────────────────────────────────
  day-doe:
    needs: fetch-data
    if: ${{ github.event.inputs.mode == 'day' || github.event.inputs.mode == 'both' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: price-data-day
          path: backtest/
      - name: JP 10分足データを取得 (存在する場合)
        uses: actions/download-artifact@v4
        with:
          name: price-data-day-jp
          path: backtest/
        continue-on-error: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy --quiet
      - run: mkdir -p backtest/phase_artifacts
      - name: デイトレ DOE 実行
        run: python3 backtest/strategy_search.py --phase doe --mode day
      - uses: actions/upload-artifact@v4
        with:
          name: doe-day
          path: backtest/phase_artifacts/doe_day.json
          retention-days: 1

  # ── Job 4: スイング WF Fold 0 ─────────────────────────────────────────────
  swing-wf-fold-0:
    needs: [fetch-data, swing-doe]
    if: ${{ github.event.inputs.mode != 'day' }}
    runs-on: ubuntu-latest
    timeout-minutes: 255
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: price-data-swing
          path: backtest/
      - run: mkdir -p backtest/phase_artifacts/checkpoint_swing_fold_0
      - uses: actions/download-artifact@v4
        with:
          name: doe-swing
          path: backtest/phase_artifacts/
      - name: チェックポイント取得 (前回の続きがあれば)
        uses: actions/download-artifact@v4
        with:
          name: checkpoint-swing-fold-0
          path: backtest/phase_artifacts/checkpoint_swing_fold_0/
        continue-on-error: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy --quiet
      - name: スイング WF Fold 0 実行
        id: run_fold
        run: python3 backtest/strategy_search.py --phase wf-fold --mode swing --fold 0 --time-limit 230
      - name: チェックポイント保存 (常に実行)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-swing-fold-0
          path: backtest/phase_artifacts/checkpoint_swing_fold_0/
          retention-days: 7
          overwrite: true
      - name: 完了時フォールド結果を保存
        if: steps.run_fold.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: wf-swing-fold-0
