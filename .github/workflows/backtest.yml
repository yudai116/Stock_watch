    needs: [swing-assemble, day-assemble]
    if: |
      always() && !cancelled() &&
      (needs.swing-assemble.result == 'success' || needs.day-assemble.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
      - name: スイング結果を取得
        uses: actions/download-artifact@v4
        with:
          name: result-swing
          path: backtest/
        continue-on-error: true
