[project]
name = "trading-core"
version = "0.1.0"
description = "US tech swing-trading system: PIT universe, bitemporal data, HMM regime, GA-tuned signals, Saxo CFD execution"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=16.0",
    "hmmlearn>=0.3.2",
    "deap>=1.4",
    "httpx>=0.27",
    "alpaca-py>=0.30",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "scipy>=1.13",
]

[project.optional-dependencies]
# FinBERT sentiment scoring (heavy; CPU inference is fine).
altdata = [
    "transformers>=4.44",
    "torch>=2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.uv]
package = false
